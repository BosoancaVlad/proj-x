<!DOCTYPE html>
<html>

<head>
    <title>Register - Secure Vault</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f4f9;
            padding: 40px;
        }

        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .primary-btn {
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            transition: opacity 0.3s;
        }

        .primary-btn:hover {
            background-color: #004494;
        }

        .primary-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .danger {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        #live-feedback {
            font-size: 12px;
            font-weight: bold;
            text-align: left;
            margin-top: 0;
            margin-bottom: 15px;
            min-height: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Register to Vault</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" onsubmit="return finalizeRegistration()">
            <input type="text" name="username" placeholder="Email or Username" required>

            <input type="password" id="reg-password" name="password" placeholder="Master Password" required>
            <p id="live-feedback"></p>

            <input type="password" id="reg-confirm" name="confirm_password" placeholder="Confirm Master Password"
                required>

            <p id="password-error"
                style="color: #dc3545; font-size: 13px; font-weight: bold; display: none; margin-top: 0; margin-bottom: 15px;">
                Passwords do not match!
            </p>

            <button type="submit" id="submit-btn" class="primary-btn" disabled>Make Account</button>
            <!--button starts disabled -->
        </form>

        <p style="margin-top: 20px; font-size: 14px;">Already have an account? <a href="{{ url_for('login') }}">Login
                here</a></p>
    </div>

    <script>
        const passInput = document.getElementById("reg-password");
        const feedbackText = document.getElementById("live-feedback");
        const submitBtn = document.getElementById("submit-btn");
        let typingTimer; // prevent spamming the server on every keystroke

        // scanner
        passInput.addEventListener('input', function () {
            clearTimeout(typingTimer);
            const password = passInput.value;

            if (password.length === 0) {
                feedbackText.innerText = "";
                submitBtn.disabled = true;
                passInput.style.border = "1px solid #ccc";
                return;
            }

            feedbackText.innerText = "Checking security...";
            feedbackText.style.color = "#6c757d";
            submitBtn.disabled = true; // Lock button while checking

            //wait half a second before sending to API
            typingTimer = setTimeout(() => {
                fetch('/api/register/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password })
                })
                    .then(response => {
                        //check if the server's bouncer kicked the user out
                        if (response.status === 429) {
                            throw new Error("RateLimited");
                        }
                        return response.json();
                    })
                    .then(data => {
                        feedbackText.innerText = data.reason;
                        if (data.status === "refused") {
                            feedbackText.style.color = "#dc3545";
                            passInput.style.border = "2px solid #dc3545";
                            submitBtn.disabled = true;
                        } else if (data.status === "approved") {
                            feedbackText.style.color = "#28a745";
                            passInput.style.border = "2px solid #28a745";
                            submitBtn.disabled = false;
                        }
                    })
                    .catch(err => {
                        if (err.message === "RateLimited") {
                            feedbackText.innerText = "Slow down! You are checking passwords too fast.";
                        } else {
                            feedbackText.innerText = "Error checking password.";
                        }
                        feedbackText.style.color = "#dc3545";
                        submitBtn.disabled = true;
                    });
            }, 500);
        });

        function finalizeRegistration() {
            const pass = document.getElementById("reg-password").value;
            const confirm = document.getElementById("reg-confirm").value;
            const errorMsg = document.getElementById("password-error");

            if (pass !== confirm) {
                errorMsg.style.display = "block";
                return false;
            }

            errorMsg.style.display = "none";
            submitBtn.disabled = true; //disable to prevent double-clicks
            submitBtn.innerText = "Creating secure vault...";
            return true;
        }
    </script>
</body>

</html>
